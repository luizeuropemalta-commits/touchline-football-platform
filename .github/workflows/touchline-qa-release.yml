name: TouchLine QA Release Verification

on:
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: touchline-qa-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.9.0
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Install release browsers and operating-system libraries
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Complete release verification
        run: pnpm run verify:release
      - name: Diff and generated-artifact safety
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
