name: TouchLine QA Release Verification

on:
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: touchline-qa-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    # Browser binaries and OS libraries are preinstalled; avoid runner apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      # Match GitHub runner ownership; Firefox rejects root in a pwuser session.
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Verify non-root browser session
        run: |
          set -eu
          test "$(id -u)" -eq 1001
          test "$(stat -c %u "$HOME")" -eq "$(id -u)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact checked-out repository
        run: |
          set -eu
          repo_root=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)
          test "$repo_root" = "$GITHUB_WORKSPACE"
          repo_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$repo_sha" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.9.0
          run_install: false
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Complete release verification
        run: pnpm run verify:release
      - name: Diff and generated-artifact safety
        run: |
          set -eu
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" diff --check
          repo_status=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" status --porcelain)
          test -z "$repo_status"
