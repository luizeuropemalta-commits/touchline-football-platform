<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="TouchLine round result vertical template">
  <defs>
    <radialGradient id="postv" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#a3ff12" stop-opacity=".18"/>
      <stop offset="50%" stop-color="#10251b" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#postv)"/>
  <image href="/touchlineArena/brand/tl-shield-lime.svg" x="486" y="178" width="108" height="108"/>
  <text x="540" y="384" text-anchor="middle" fill="#a3ff12" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="950" letter-spacing=".16em">ROUND RESULT</text>
  <text x="540" y="532" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="950">{{fixture.homeCode}} {{fixture.homeScore}}</text>
  <text x="540" y="650" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="950">{{fixture.awayScore}} {{fixture.awayCode}}</text>
  <text x="540" y="728" text-anchor="middle" fill="#edf8ff" fill-opacity=".62" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="850">{{fixture.homeClub}} vs {{fixture.awayClub}}</text>
  <rect x="300" y="884" width="480" height="770" rx="42" fill="#a3ff12" opacity=".10" stroke="#a3ff12" stroke-opacity=".34" stroke-dasharray="12 14"/>
  <text x="540" y="1238" text-anchor="middle" fill="#edf8ff" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="950">CARD OFICIAL</text>
  <text x="540" y="1282" text-anchor="middle" fill="#edf8ff" fill-opacity=".42" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">{{fixture.topPerformer}}</text>
  <text x="540" y="1750" text-anchor="middle" fill="#edf8ff" fill-opacity=".62" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="850">{{editorial.comment}}</text>
  <text x="540" y="1812" text-anchor="middle" fill="#a3ff12" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="950">TOUCHLINE ENGLAND LEAGUE</text>
</svg>
